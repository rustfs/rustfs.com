<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#10243d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="Liberation Sans, DejaVu Sans, Noto Sans, sans-serif">
    <text x="600" y="168" text-anchor="middle" fill="#e5e7eb" font-size="28" letter-spacing="6">ON-DEMAND MIGRATION</text>
    <text x="600" y="268" text-anchor="middle" fill="#ffffff" font-size="58" font-weight="700">Pull objects into RustFS</text>
    <text x="600" y="340" text-anchor="middle" fill="url(#accent)" font-size="36" font-weight="700">from an external object store</text>
    <g font-size="24" fill="#e5e7eb">
      <rect x="120" y="410" width="280" height="80" rx="10" fill="#1f2937" stroke="#374151"/>
      <text x="260" y="458" text-anchor="middle">GET miss</text>
      <rect x="460" y="410" width="280" height="80" rx="10" fill="#1f2937" stroke="#374151"/>
      <text x="600" y="458" text-anchor="middle">Prefix or full backfill</text>
      <rect x="800" y="410" width="280" height="80" rx="10" fill="#1f2937" stroke="#374151"/>
      <text x="940" y="458" text-anchor="middle">Read-only source</text>
      <line x1="400" y1="450" x2="460" y2="450" stroke="url(#accent)" stroke-width="3"/>
      <line x1="740" y1="450" x2="800" y2="450" stroke="url(#accent)" stroke-width="3"/>
    </g>
    <text x="600" y="555" text-anchor="middle" fill="#9ca3af" font-size="22">A local copy does not keep following the source</text>
  </g>
</svg>
