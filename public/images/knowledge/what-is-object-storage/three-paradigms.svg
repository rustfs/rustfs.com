<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #171717; }
    .t { font-size: 27px; font-weight: 700; }
    .col { font-size: 20px; font-weight: 700; }
    .cap { fill: #6b7280; font-size: 15px; }
    .w { fill: #ffffff; }
    .chip { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .trait { fill: #374151; font-size: 15px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="40" y="56" class="t">Three ways to store a byte</text>

  <!-- column 1: block -->
  <g>
    <rect x="40" y="90" width="350" height="470" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="215" y="130" class="col" text-anchor="middle">Block storage</text>
    <text x="215" y="154" class="cap" text-anchor="middle">addressed by sector / LBA</text>
    <!-- disk platter -->
    <circle cx="215" cy="290" r="95" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="215" cy="290" r="18" fill="#d1d5db"/>
    <g fill="#2568f5">
      <rect x="152" y="230" width="60" height="30" rx="3"/>
      <rect x="222" y="230" width="60" height="30" rx="3"/>
      <rect x="152" y="320" width="60" height="30" rx="3"/>
      <rect x="222" y="320" width="60" height="30" rx="3"/>
    </g>
    <text x="215" y="415" class="cap mono" text-anchor="middle">LBA 482,113 → 4 KiB</text>
    <text x="80" y="455" class="trait">· fastest, lowest latency</text>
    <text x="80" y="480" class="trait">· raw capacity, no structure</text>
    <text x="80" y="505" class="trait">· attached to one host</text>
    <text x="80" y="530" class="trait">· SAN, local disks, volumes</text>
  </g>

  <!-- column 2: file -->
  <g>
    <rect x="425" y="90" width="350" height="470" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="600" y="130" class="col" text-anchor="middle">File storage</text>
    <text x="600" y="154" class="cap" text-anchor="middle">addressed by path + inode</text>
    <!-- tree -->
    <rect x="560" y="185" width="80" height="36" rx="5" fill="#171717"/>
    <text x="600" y="209" class="chip" text-anchor="middle" style="font-size:13px">/data</text>
    <g stroke="#9ca3af" stroke-width="2" fill="none">
      <path d="M600 221 L 505 265"/>
      <path d="M600 221 L 600 265"/>
      <path d="M600 221 L 695 265"/>
    </g>
    <rect x="455" y="268" width="100" height="34" rx="5" fill="#2568f5"/>
    <text x="505" y="291" class="chip" text-anchor="middle" style="font-size:13px">docs/</text>
    <rect x="550" y="268" width="100" height="34" rx="5" fill="#2568f5"/>
    <text x="600" y="291" class="chip" text-anchor="middle" style="font-size:13px">photos/</text>
    <rect x="645" y="268" width="100" height="34" rx="5" fill="#2568f5"/>
    <text x="695" y="291" class="chip" text-anchor="middle" style="font-size:13px">logs/</text>
    <rect x="530" y="330" width="140" height="34" rx="5" fill="#ea580c"/>
    <text x="600" y="353" class="chip" text-anchor="middle" style="font-size:13px">report.pdf</text>
    <text x="600" y="415" class="cap mono" text-anchor="middle">/photos/report.pdf → inode 7</text>
    <text x="465" y="455" class="trait">· hierarchy with folders</text>
    <text x="465" y="480" class="trait">· rich POSIX semantics</text>
    <text x="465" y="505" class="trait">· locks and metadata on files</text>
    <text x="465" y="530" class="trait">· NAS, NFS/SMB, local FS</text>
  </g>

  <!-- column 3: object -->
  <g>
    <rect x="810" y="90" width="350" height="470" rx="10" fill="#eff4ff" stroke="#2568f5" stroke-width="2"/>
    <text x="985" y="130" class="col" text-anchor="middle">Object storage</text>
    <text x="985" y="154" class="cap" text-anchor="middle">addressed by key over HTTP</text>
    <!-- flat pool of objects -->
    <rect x="845" y="190" width="280" height="52" rx="6" fill="#2568f5"/>
    <text x="985" y="222" class="chip mono" text-anchor="middle">a/one.bin</text>
    <rect x="845" y="252" width="280" height="52" rx="6" fill="#ea580c"/>
    <text x="985" y="284" class="chip mono" text-anchor="middle">b/two.bin</text>
    <rect x="845" y="314" width="280" height="52" rx="6" fill="#2568f5"/>
    <text x="985" y="346" class="chip mono" text-anchor="middle">c/three.bin</text>
    <text x="985" y="415" class="cap mono" text-anchor="middle">PUT /bucket/c/three.bin</text>
    <text x="845" y="455" class="trait">· flat namespace, no folders</text>
    <text x="845" y="480" class="trait">· data + metadata as one unit</text>
    <text x="845" y="505" class="trait">· scales to billions of objects</text>
    <text x="845" y="530" class="trait">· HTTP API, S3-compatible</text>
  </g>

  <text x="600" y="610" class="cap" text-anchor="middle">Object storage trades deep hierarchy and low latency for near-limitless scale and rich per-object metadata.</text>
</svg>
