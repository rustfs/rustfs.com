<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #171717; }
    .t { font-size: 27px; font-weight: 700; }
    .lbl { font-size: 18px; font-weight: 600; }
    .cap { fill: #6b7280; font-size: 15px; }
    .w { fill: #ffffff; }
    .chip { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .meta { fill: #374151; font-size: 15px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .http { fill: #374151; font-size: 16px; font-weight: 600; }
  </style>

  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="40" y="56" class="t">Anatomy of an object</text>

  <!-- client left -->
  <g>
    <rect x="60" y="240" width="170" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="145" y="280" class="lbl" text-anchor="middle">client / app</text>
    <text x="145" y="305" class="cap" text-anchor="middle">SDK · curl · browser</text>
  </g>

  <!-- PUT arrow -->
  <g stroke="#2568f5" stroke-width="2.5" fill="none">
    <path d="M240 262 L 360 262" marker-end="url(#arb)"/>
  </g>
  <text x="300" y="240" class="http mono" text-anchor="middle">PUT</text>
  <text x="300" y="290" class="cap" text-anchor="middle">bytes + metadata</text>

  <!-- object card -->
  <g>
    <rect x="370" y="110" width="460" height="380" rx="12" fill="#eff4ff" stroke="#2568f5" stroke-width="2"/>
    <!-- key -->
    <rect x="395" y="135" width="410" height="52" rx="7" fill="#171717"/>
    <text x="600" y="169" class="chip mono" text-anchor="middle">photos/2026/cat.jpg</text>
    <text x="600" y="210" class="cap" text-anchor="middle">the key — unique within its bucket</text>
    <!-- data -->
    <rect x="395" y="232" width="410" height="80" rx="7" fill="#2568f5"/>
    <text x="600" y="266" class="chip" text-anchor="middle">data · 12 MB</text>
    <text x="600" y="294" class="w mono" text-anchor="middle" style="font-size:14px">immutable bytes, written and read whole</text>
    <!-- metadata -->
    <rect x="395" y="330" width="410" height="130" rx="7" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="415" y="358" class="lbl">metadata</text>
    <text x="415" y="384" class="meta mono">content-type: image/jpeg</text>
    <text x="415" y="408" class="meta mono">etag: "d41d8cd9..."  ·  version-id: v3</text>
    <text x="415" y="432" class="meta mono">x-amz-meta-owner: team-zeta</text>
    <text x="415" y="456" class="meta mono">created: 2026-10-03 · class: STANDARD</text>
  </g>

  <!-- GET arrow -->
  <g stroke="#ea580c" stroke-width="2.5" fill="none">
    <path d="M840 262 L 960 262" marker-end="url(#aro)"/>
  </g>
  <text x="900" y="240" class="http mono" text-anchor="middle">GET</text>
  <text x="900" y="290" class="cap" text-anchor="middle">fetch by key</text>

  <!-- client right -->
  <g>
    <rect x="970" y="240" width="170" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="1055" y="280" class="lbl" text-anchor="middle">any consumer</text>
    <text x="1055" y="305" class="cap" text-anchor="middle">app · CDN · analytics</text>
  </g>

  <!-- bottom caption -->
  <text x="600" y="545" class="cap" text-anchor="middle">Buckets give the namespace its top level: one flat pool per bucket, no folders inside —</text>
  <text x="600" y="570" class="cap" text-anchor="middle">"photos/2026/" is simply the first characters of a key, not a directory the object sits in.</text>

  <defs>
    <marker id="arb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2568f5"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>
</svg>
