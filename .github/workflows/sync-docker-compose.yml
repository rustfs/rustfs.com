# Sync public/docker-compose.yml from rustfs/rustfs (source of truth).
#
# Triggers
# --------
# - repository_dispatch (type: sync-docker-compose): near-real-time updates
#   from rustfs/rustfs after the canonical file changes
# - workflow_dispatch: manual runs from the Actions tab
# - hourly schedule: fallback if dispatch secrets are missing or a push is missed
#
# Cross-repo dispatch (configured on rustfs/rustfs, not this repo)
# ---------------------------------------------------------------
# Pull-based sync on this repository needs only the default GITHUB_TOKEN with
# contents: write. No extra secrets are required here.
#
# rustfs/rustfs should call repository_dispatch when its root docker-compose.yml
# changes. Example (sibling PR on rustfs/rustfs):
#
#   - name: Notify rustfs.com to sync docker-compose.yml
#     env:
#       GH_TOKEN: ${{ secrets.RUSTFS_COM_DISPATCH_TOKEN }}
#     run: |
#       gh api repos/rustfs/rustfs.com/dispatches \
#         -f event_type='sync-docker-compose'
#
# Token stored on rustfs/rustfs (suggested secret name: RUSTFS_COM_DISPATCH_TOKEN):
# - Classic PAT: `public_repo` (or `repo`)
# - Fine-grained PAT / GitHub App installation token: Contents (read and write)
#   on rustfs/rustfs.com — required by POST /repos/{owner}/{repo}/dispatches
#
# Direct-push to the default branch is intentional: Cloudflare deploys from git,
# and this repo has no existing bot-PR automation. Unchanged files produce no commit.

name: Sync docker-compose.yml

on:
  repository_dispatch:
    types: [sync-docker-compose]
  workflow_dispatch:
  schedule:
    # Hourly fallback; minute offset matches other scheduled jobs in this repo.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-docker-compose
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Fetch canonical docker-compose.yml
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --retry-delay 2 --max-time 30 \
            -H "Accept: application/vnd.github.raw" \
            -H "User-Agent: rustfs.com-docker-compose-sync" \
            -o "${RUNNER_TEMP}/docker-compose.yml" \
            "https://raw.githubusercontent.com/rustfs/rustfs/main/docker-compose.yml"
          test -s "${RUNNER_TEMP}/docker-compose.yml"

      - name: Commit and push if changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dest="public/docker-compose.yml"
          mkdir -p public

          if [[ -f "${dest}" ]] && cmp -s "${RUNNER_TEMP}/docker-compose.yml" "${dest}"; then
            echo "docker-compose.yml is already up to date."
            exit 0
          fi

          cp "${RUNNER_TEMP}/docker-compose.yml" "${dest}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${dest}"

          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "chore: sync docker-compose.yml from rustfs/rustfs"
          git pull --rebase --autostash origin "${DEFAULT_BRANCH}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
