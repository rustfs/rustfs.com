name: Deploy homepage metrics Worker

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-homepage-metrics.yml"
      - "lib/homepage-metrics.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/homepage-metrics.json"
      - "workers/homepage-metrics/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-metrics-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Worker
        run: pnpm run check:homepage-metrics-worker

      - name: Deploy Worker
        run: pnpm exec wrangler deploy --config workers/homepage-metrics/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
